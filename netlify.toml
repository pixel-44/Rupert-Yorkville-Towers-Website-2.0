# Netlify build + routing for the Rupert Yorkville Towers resident board.
#
# Static assets (stylesheet, favicon, client script) are served straight from the
# CDN out of public/. Everything else falls through to the Express app running as
# a single serverless function.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # EJS templates and the schema are read from disk at runtime, so they have to
  # be bundled alongside the function code.
  included_files = ["views/**", "src/schema.sql"]

# Atelier's optional design-assistant interpreter. Everything else about the
# studio is static and comes straight off the CDN out of public/atelier/.
[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# Prompts for these during a "Deploy to Netlify" one-click install, so the site
# is configured before its first build instead of after.
[template.environment]
  DATABASE_URL = "Postgres connection string — from Netlify DB, Neon, or Supabase. Leave blank if you added the Netlify DB extension."
  NODE_ENV = "Set to: production"
  ANTHROPIC_API_KEY = "Optional. Only widens what Atelier's design assistant understands — it works without one."

[dev]
  command = "npm start"
  targetPort = 3000
  publish = "public"
