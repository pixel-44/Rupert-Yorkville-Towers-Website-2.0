<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>XANADU</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./xanadu.css">
</head>
<body>

<!-- Activation gate. Nothing starts until the visitor grants camera access. -->
<div id="perm">
  <div class="ico">
    <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="28" r="26" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="18" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <circle cx="28" cy="28" r="4" fill="rgba(255,255,255,0.6)"/>
      <line x1="28" y1="2" x2="28" y2="10" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <line x1="28" y1="46" x2="28" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <line x1="2" y1="28" x2="10" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <line x1="46" y1="28" x2="54" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    </svg>
  </div>
  <h1>XANADU</h1>
  <p>Live pose detection. Real-time figure tracing on this device. Camera access required.</p>
  <button class="bprim" id="ballow">ALLOW CAMERA</button>
  <div class="foot"><span></span>XANADU · SEE THROUGH WALLS<span></span></div>
</div>

<div id="app">
  <div id="cam">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="cl"></canvas>
    <div class="scanlines"></div>
    <div id="sbar">
      <div class="pill"><span class="dot dr pu"></span>LIVE</div>
      <div class="pill" id="ppose"><span class="dot dy pu"></span>LOADING MODEL...</div>
    </div>
    <div id="aname">XANADU</div>
    <div class="c ctl"></div><div class="c ctr"></div>
    <div class="c cbl"></div><div class="c cbr"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="./xanadu.js"></script>
</body>
</html>
